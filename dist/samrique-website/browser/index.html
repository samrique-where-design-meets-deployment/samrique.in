    <script>
      (() => {
        const params = new URLSearchParams(window.location.search);
        const path = params.get('__ghp_path');
        if (path === null) return;

        const base = new URL(document.querySelector('base').href);
        const target = new URL(path.replace(/^\/+/, ''), base);
        if (!target.pathname.startsWith(base.pathname)) return;

        const search = params.get('__ghp_search') || '';
        const hash = params.get('__ghp_hash') || '';
        window.history.replaceState(null, '', `${target.pathname}${search}${hash}`);
      })();
    </script>
