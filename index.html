<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Samrique — Flutter Development & Digital Solutions</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        dark: { 950: '#070B14', 900: '#0F172A', 800: '#1E293B', 700: '#334155' },
                        accent: { DEFAULT: '#FF6B6B', light: '#FF8E8E', dark: '#E05252' },
                        coral: { DEFAULT: '#F97316', light: '#FB923C' }
                    },
                    fontFamily: { sans: ['Inter', 'sans-serif'] }
                }
            }
        }
    </script>
    <!-- Google Fonts Inter & FontAwesome -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Custom Modular Styles -->
    <link rel="stylesheet" href="./assets/css/style.css">
</head>
<body class="bg-dark-900 text-slate-100 antialiased selection:bg-coral selection:text-white">

    <!-- Header / Navigation -->
    <div id="site-header"></div>

    <!-- Hero Section -->
    <div id="site-hero"></div>

    <!-- Services Section -->
    <div id="site-services"></div>

    <!-- Selected Projects Section -->
    <div id="site-projects"></div>

    <!-- About Section -->
    <div id="site-about"></div>

    <!-- Contact Section -->
    <div id="site-contact"></div>

    <!-- Footer -->
    <div id="site-footer"></div>

    <!-- Main JavaScript App Module -->
    <script type="module" src="./assets/js/app.js"></script>
</body>
</html>
